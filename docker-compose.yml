version: '3.8'
services:
  db:
    image: postgres:14
    environment:
      POSTGRES_DB: onlinestore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234papa
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:alpine
  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgres://postgres:1234papa@db:5432/onlinestore
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
volumes:
  postgres_data: